version: 0.2

env:
  variables:
    HUB_URL: "http://selenium-hub:4444"

phases:
  install:
    runtime-versions:
      java: corretto17

  pre_build:
    commands:
      - echo "Starting Selenium Grid..."
      - docker-compose up -d
      - docker ps
      - echo "Waiting for Grid to be ready..."

      - |
        until docker exec selenium-hub curl -s http://localhost:4444/status | grep '"ready":true'; do
          echo "Grid not ready yet..."
          sleep 5
        done

      - echo "Selenium Grid is ready!"

  build:
    commands:
      - mvn clean test

  post_build:
    commands:
      - docker-compose down
      - echo "Build completed!"